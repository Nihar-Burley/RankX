name: ${COMPOSE_PROJECT_NAME:-rankx}

x-spring-common-env: &spring-common-env
  CONFIG_SERVER_URL: http://config-server:8888
  EUREKA_DEFAULT_ZONE: http://discovery-server:8761/eureka

x-service-defaults: &service-defaults
  init: true
  restart: unless-stopped
  networks:
    - rankx-network
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  mysql:
    <<: *service-defaults
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-for-local-docker}
      MYSQL_APP_USER: ${MYSQL_APP_USER:-rankx_app}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:-change-me-app-password}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init/001-create-databases.sql:/docker-entrypoint-initdb.d/001-create-databases.sql:ro
      - ./docker/mysql/init/002-create-app-user.sh:/docker-entrypoint-initdb.d/002-create-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    <<: *service-defaults
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  config-server:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Backend/config-server/Dockerfile

  discovery-server:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Backend/discovery-server/Dockerfile
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      CONFIG_SERVER_URL: http://config-server:8888

  auth-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Backend/auth-service/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      <<: *spring-common-env
      AUTH_SERVICE_DB_URL: jdbc:mysql://mysql:3306/application_auth_db?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=UTC
      AUTH_SERVICE_DB_USERNAME: ${MYSQL_APP_USER:-rankx_app}
      AUTH_SERVICE_DB_PASSWORD: ${MYSQL_APP_PASSWORD:-change-me-app-password}
      AUTH_SERVICE_REDIS_HOST: redis
      AUTH_SERVICE_REDIS_PORT: 6379
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET:-cmFua3gtbG9jYWwtZG9ja2VyLXNlY3JldC1mb3Itand0LTIwMjY=}
      APP_SECURITY_ALLOWED_ORIGINS: ${APP_SECURITY_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      LOCAL_AUTH_BOOTSTRAP_ENABLED: ${LOCAL_AUTH_BOOTSTRAP_ENABLED:-true}
      LOCAL_AUTH_BOOTSTRAP_ADMIN_USER_ID: ${LOCAL_AUTH_BOOTSTRAP_ADMIN_USER_ID:-00000000-0000-0000-0000-000000000101}
      LOCAL_AUTH_BOOTSTRAP_ADMIN_USERNAME: ${LOCAL_AUTH_BOOTSTRAP_ADMIN_USERNAME:-rankx_admin}
      LOCAL_AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${LOCAL_AUTH_BOOTSTRAP_ADMIN_PASSWORD:-RankXAdmin123!}
      LOCAL_AUTH_BOOTSTRAP_ADMIN_MOBILE: ${LOCAL_AUTH_BOOTSTRAP_ADMIN_MOBILE:-9000000001}
      LOCAL_AUTH_BOOTSTRAP_TEST_USER_ID: ${LOCAL_AUTH_BOOTSTRAP_TEST_USER_ID:-00000000-0000-0000-0000-000000000102}
      LOCAL_AUTH_BOOTSTRAP_TEST_USERNAME: ${LOCAL_AUTH_BOOTSTRAP_TEST_USERNAME:-rankx_test}
      LOCAL_AUTH_BOOTSTRAP_TEST_PASSWORD: ${LOCAL_AUTH_BOOTSTRAP_TEST_PASSWORD:-RankXTest123!}
      LOCAL_AUTH_BOOTSTRAP_TEST_MOBILE: ${LOCAL_AUTH_BOOTSTRAP_TEST_MOBILE:-9000000002}

  problem-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Backend/problemservice/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      <<: *spring-common-env
      PROBLEM_SERVICE_DB_URL: jdbc:mysql://mysql:3306/application_problemdb?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=UTC
      PROBLEM_SERVICE_DB_USERNAME: ${MYSQL_APP_USER:-rankx_app}
      PROBLEM_SERVICE_DB_PASSWORD: ${MYSQL_APP_PASSWORD:-change-me-app-password}
      PROBLEM_SERVICE_SQL_INIT_MODE: always

  attempt-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Backend/attempt-service/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      <<: *spring-common-env
      ATTEMPT_SERVICE_DB_URL: jdbc:mysql://mysql:3306/application_attempt_db?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=UTC
      ATTEMPT_SERVICE_DB_USERNAME: ${MYSQL_APP_USER:-rankx_app}
      ATTEMPT_SERVICE_DB_PASSWORD: ${MYSQL_APP_PASSWORD:-change-me-app-password}

  question-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Backend/question-service/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      <<: *spring-common-env
      QUESTION_SERVICE_DB_URL: jdbc:mysql://mysql:3306/application_question_db?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=UTC
      QUESTION_SERVICE_DB_USERNAME: ${MYSQL_APP_USER:-rankx_app}
      QUESTION_SERVICE_DB_PASSWORD: ${MYSQL_APP_PASSWORD:-change-me-app-password}
      QUESTION_SERVICE_SQL_INIT_MODE: always

  quiz-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Backend/quiz-service/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      question-service:
        condition: service_healthy
    environment:
      <<: *spring-common-env
      QUIZ_SERVICE_DB_URL: jdbc:mysql://mysql:3306/application_quiz_db?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=UTC
      QUIZ_SERVICE_DB_USERNAME: ${MYSQL_APP_USER:-rankx_app}
      QUIZ_SERVICE_DB_PASSWORD: ${MYSQL_APP_PASSWORD:-change-me-app-password}
      QUIZ_SERVICE_SQL_INIT_MODE: always

  user-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Backend/user-service/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      problem-service:
        condition: service_healthy
      quiz-service:
        condition: service_healthy
    environment:
      <<: *spring-common-env
      USER_SERVICE_DB_URL: jdbc:mysql://mysql:3306/application_userdb?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=UTC
      USER_SERVICE_DB_USERNAME: ${MYSQL_APP_USER:-rankx_app}
      USER_SERVICE_DB_PASSWORD: ${MYSQL_APP_PASSWORD:-change-me-app-password}

  submission-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Backend/submissionservice/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      problem-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    environment:
      <<: *spring-common-env
      SUBMISSION_SERVICE_DB_URL: jdbc:mysql://mysql:3306/application_submission_db?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=UTC
      SUBMISSION_SERVICE_DB_USERNAME: ${MYSQL_APP_USER:-rankx_app}
      SUBMISSION_SERVICE_DB_PASSWORD: ${MYSQL_APP_PASSWORD:-change-me-app-password}
      JUDGE0_BASE_URL: ${JUDGE0_BASE_URL:-https://ce.judge0.com}

  result-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Backend/result-service/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      attempt-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    environment:
      <<: *spring-common-env
      RESULT_SERVICE_DB_URL: jdbc:mysql://mysql:3306/application_result_db?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=UTC
      RESULT_SERVICE_DB_USERNAME: ${MYSQL_APP_USER:-rankx_app}
      RESULT_SERVICE_DB_PASSWORD: ${MYSQL_APP_PASSWORD:-change-me-app-password}

  api-gateway:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Backend/api-gateway/Dockerfile
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      problem-service:
        condition: service_healthy
      submission-service:
        condition: service_healthy
      attempt-service:
        condition: service_healthy
      question-service:
        condition: service_healthy
      quiz-service:
        condition: service_healthy
      result-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    environment:
      <<: *spring-common-env
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET:-cmFua3gtbG9jYWwtZG9ja2VyLXNlY3JldC1mb3Itand0LTIwMjY=}
    ports:
      - "${API_GATEWAY_HOST_PORT:-8080}:8080"

  rankx-web:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Frontend/Rankx/Dockerfile
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "${RANKX_WEB_HOST_PORT:-3000}:8080"

  rankx-admin:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Frontend/Rankx-admin/Dockerfile
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "${RANKX_ADMIN_HOST_PORT:-3001}:8080"

networks:
  rankx-network:
    name: ${DOCKER_NETWORK_NAME:-rankx-network}

volumes:
  mysql-data:
    name: ${MYSQL_VOLUME_NAME:-rankx-mysql-data}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: api-gateway
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
          lower-case-service-id: false
security:
  jwt:
    secret: ${SECURITY_JWT_SECRET:cmFua3gtbG9jYWwtZG9ja2VyLXNlY3JldC1mb3Itand0LTIwMjY=}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: ${GATEWAY_LOG_LEVEL:INFO}
    reactor.netty.http.client: ${GATEWAY_NETTY_LOG_LEVEL:WARN}
    reactor.netty.channel: ${GATEWAY_NETTY_CHANNEL_LOG_LEVEL:WARN}
    org.springframework.web: ${GATEWAY_WEB_LOG_LEVEL:INFO}
    org.springframework.validation: ${GATEWAY_VALIDATION_LOG_LEVEL:INFO}

metrics:
  export:
    simple:
      enabled: true

observation:
  enabled: true

management:
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
      probes:
        enabled: true
  info:
    env:
      enabled: ${MANAGEMENT_INFO_ENV_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_WEB_EXPOSURE:health,info}

server.port=${SERVER_PORT:8086}
server.shutdown=graceful

spring.datasource.url=${QUIZ_SERVICE_DB_URL:jdbc:mysql://localhost:3306/application_quiz_db?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=UTC}
spring.datasource.username=${QUIZ_SERVICE_DB_USERNAME:root}
spring.datasource.password=${QUIZ_SERVICE_DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${QUIZ_SERVICE_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${QUIZ_SERVICE_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${QUIZ_SERVICE_SQL_INIT_MODE:always}
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

spring.lifecycle.timeout-per-shutdown-phase=30s

management.endpoints.web.exposure.include=${MANAGEMENT_WEB_EXPOSURE:health,info}
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
management.endpoint.health.probes.enabled=true
management.info.env.enabled=${MANAGEMENT_INFO_ENV_ENABLED:false}

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

############################################################
# Swagger Configuration
############################################################
rankx.swagger.enabled=true
rankx.swagger.title=Quiz Service API
rankx.swagger.description=REST APIs for RankX Quiz Management Service
rankx.swagger.version=v1

############################################################
# Contact
############################################################

rankx.swagger.contact-name=RankX Team
rankx.swagger.contact-email=support@rankx.com
rankx.swagger.contact-url=https://rankx.com

############################################################
# License
############################################################

rankx.swagger.license-name=Apache License 2.0
rankx.swagger.license-url=https://www.apache.org/licenses/LICENSE-2.0

############################################################
# Documentation
############################################################

rankx.swagger.documentation=https://docs.rankx.com

############################################################
# Server
############################################################

rankx.swagger.server-url=http://localhost:8082
rankx.swagger.server-description=Development Server

############################################################
# SpringDoc
############################################################

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json

############################################################
# OpenAPI Groups
############################################################

rankx.swagger.public-group-enabled=true
rankx.swagger.admin-group-enabled=true
rankx.swagger.internal-group-enabled=true

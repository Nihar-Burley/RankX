server.port=${SERVER_PORT:8082}
server.shutdown=graceful

spring.datasource.url=${PROBLEM_SERVICE_DB_URL:jdbc:mysql://localhost:3306/application_problemdb}
spring.datasource.username=${PROBLEM_SERVICE_DB_USERNAME:root}
spring.datasource.password=${PROBLEM_SERVICE_DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${PROBLEM_SERVICE_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${PROBLEM_SERVICE_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${PROBLEM_SERVICE_SQL_INIT_MODE:always}

spring.lifecycle.timeout-per-shutdown-phase=30s

management.endpoints.web.exposure.include=${MANAGEMENT_WEB_EXPOSURE:health,info}
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
management.endpoint.health.probes.enabled=true
management.info.env.enabled=${MANAGEMENT_INFO_ENV_ENABLED:false}

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

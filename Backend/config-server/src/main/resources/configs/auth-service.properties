server.port=${SERVER_PORT:8081}
server.shutdown=graceful

spring.datasource.url=${AUTH_SERVICE_DB_URL:jdbc:mysql://localhost:3306/application_auth_db}
spring.datasource.username=${AUTH_SERVICE_DB_USERNAME:root}
spring.datasource.password=${AUTH_SERVICE_DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${AUTH_SERVICE_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${AUTH_SERVICE_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.lifecycle.timeout-per-shutdown-phase=30s
spring.data.redis.host=${AUTH_SERVICE_REDIS_HOST:localhost}
spring.data.redis.port=${AUTH_SERVICE_REDIS_PORT:6379}
spring.data.redis.timeout=${AUTH_SERVICE_REDIS_TIMEOUT:60000}

management.endpoints.web.exposure.include=${MANAGEMENT_WEB_EXPOSURE:health,info}
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
management.endpoint.health.probes.enabled=true
management.info.env.enabled=${MANAGEMENT_INFO_ENV_ENABLED:false}

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

security.jwt.secret=${SECURITY_JWT_SECRET:cmFua3gtbG9jYWwtZG9ja2VyLXNlY3JldC1mb3Itand0LTIwMjY=}

logging.level.org.springframework.security=${AUTH_SERVICE_SECURITY_LOG_LEVEL:INFO}

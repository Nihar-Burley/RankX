spring.application.name=submission-service
server.port=${SERVER_PORT:8083}
server.shutdown=graceful

spring.datasource.url=${SUBMISSION_SERVICE_DB_URL:jdbc:mysql://localhost:3306/application_submission_db}
spring.datasource.username=${SUBMISSION_SERVICE_DB_USERNAME:root}
spring.datasource.password=${SUBMISSION_SERVICE_DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${SUBMISSION_SERVICE_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SUBMISSION_SERVICE_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.lifecycle.timeout-per-shutdown-phase=30s

management.endpoints.web.exposure.include=${MANAGEMENT_WEB_EXPOSURE:health,info}
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
management.endpoint.health.probes.enabled=true
management.info.env.enabled=${MANAGEMENT_INFO_ENV_ENABLED:false}

judge0.base-url=${JUDGE0_BASE_URL:https://ce.judge0.com}

feign.client.config.default.connectTimeout=${FEIGN_CONNECT_TIMEOUT_MS:5000}
feign.client.config.default.readTimeout=${FEIGN_READ_TIMEOUT_MS:30000}

logging.level.org.springframework.web=${SUBMISSION_SERVICE_WEB_LOG_LEVEL:INFO}
logging.level.com.application.submissionservice=${SUBMISSION_SERVICE_APP_LOG_LEVEL:INFO}

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
